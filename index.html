<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa Rewards</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6fa;
      color: #182033;
      min-height: 100vh;
    }

    header {
      background: #172033;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
    }

    .brand span {
      color: #f3c443;
    }

    .badge {
      background: #f3c443;
      color: #172033;
      padding: 9px 15px;
      border-radius: 22px;
      font-weight: bold;
      font-size: 13px;
    }

    main {
      max-width: 950px;
      margin: auto;
      padding: 22px 15px 60px;
    }

    .hero {
      background: linear-gradient(135deg, #243b60, #5875a0);
      color: white;
      padding: 30px 24px;
      border-radius: 25px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 16px;
      opacity: .95;
    }

    .panel {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .panel h2 {
      margin-bottom: 18px;
      font-size: 23px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,.05);
    }
