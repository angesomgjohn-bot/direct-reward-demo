<!doctype html>
<html lang="am">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Direct Rewards</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="brand">💎 DIRECT REWARDS</div>
  <div class="demo">DEMO ONLY</div>
</header>

<main>

<section class="hero">
  <h1>እንኳን ደህና መጡ</h1>
  <p>የእርስዎ Reward Dashboard እዚህ ይገኛል።</p>
</section>

<!-- REGISTER -->
<section id="register" class="panel">
  <h2>Register</h2>

  <input id="regName" type="text" placeholder="ስም">

  <input id="regPhone" type="tel" placeholder="ስልክ ቁጥር">

  <input id="regPassword" type="password" placeholder="ፓስዎርድ">

  <input id="regConfirm" type="password" placeholder="ኮንፊርም ፓስዎርድ">

  <button onclick="register()">Register</button>

  <p id="registerMessage"></p>

  <p>
    አካውንት አለዎት?
    <button class="linkBtn" onclick="showLogin()">Login</button>
  </p>
</section>

<!-- LOGIN -->
<section id="login" class="panel" hidden>
  <h2>Login</h2>

  <input id="loginPhone" type="tel" placeholder="ስልክ ቁጥር">

  <input id="loginPassword" type="password" placeholder="ፓስዎርድ">

  <button onclick="login()">Login</button>

  <p id="loginMessage"></p>

  <p>
    አካውንት የለዎትም?
    <button class="linkBtn" onclick="showRegister()">Register</button>
  </p>
</section>

<!-- DASHBOARD -->
<section id="dashboard" hidden>

  <div class="card">
    <h2 id="welcome"></h2>
    <p>Welcome to your dashboard.</p>
  </div>

  <div class="grid">

    <div class="card">
      <span>Balance</span>
      <strong id="balance">0 ETB</strong>
    </div>

    <div class="card">
      <span>Rewards</span>
      <strong id="rewards">0 ETB</strong>
    </div>

    <div class="card">
      <span>Referrals</span>
      <strong id="refcount">0</strong>
    </div>

  </div>

  <button onclick="logout()">Logout</button>

</section>

</main>

<script src="app.js"></script>

</body>
</html>
